[project]
name = "tradelab"
version = "0.1.0"
description = "Indian equity/ETF research and PAPER-trading platform. No live order path."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy==2.1.4",
    "jinja2>=3.1",
    "apscheduler==3.11.3",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "playwright>=1.45"]

[project.scripts]
tradelab = "tradelab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradelab = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["tradelab"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["feedparser", "apscheduler.*"]
ignore_missing_imports = true
